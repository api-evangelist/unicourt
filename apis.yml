aid: unicourt
name: UniCourt
image: https://cdn.prod.website-files.com/68e96a346d8a3699dd3316b1/698113f630e1434ec18db8f1_og-img-logo.jpg
description: UniCourt provides a single platform for accessing litigation data, analytics, and insights. It offers APIs, widgets, and data share
  solutions that give real-time access to over 2 billion dockets and documents from 4,000+ state and federal courts. Customers can integrate structured
  litigation data into applications, data warehouses, and experience management systems for better decision‑making and risk assessment.
